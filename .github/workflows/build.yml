name: Build site + TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Publish web (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: android
        run: |
          gradle --no-daemon assembleDebug \
            -PktvUrl="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/tv.html?auto=1"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/HomeKTV.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HomeKTV-apk
          path: HomeKTV.apk
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 家庭 KTV（最新版 APK）
          prerelease: false
          make_latest: true
          body: |
            安裝到 Sony / Google TV：下載 HomeKTV.apk → 用 USB 或「Send Files to TV」傳到電視 → 用檔案管理員開啟安裝。
            版本：1.0.${{ github.run_number }}（${{ github.sha }}）
          files: HomeKTV.apk
