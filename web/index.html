<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家庭 KTV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&display=swap">
<style>
  :root{--bg:#0d0a17;--panel:#171228;--line:#2f2650;--fg:#f5f1ff;--muted:#a69cc4;--pink:#ff3d9a;color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(60vw 40vw at 50% 30%,#2a1550,var(--bg) 70%);color:var(--fg);font-family:"Noto Sans TC",system-ui,sans-serif;padding:24px 16px;box-sizing:border-box}
  .box{width:min(420px,100%);display:grid;gap:14px;text-align:center}
  h1{font-weight:900;font-size:40px;margin:0 0 10px}h1 b{color:var(--pink)}
  a{display:block;padding:18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:900;font-size:20px}
  a small{display:block;font-weight:500;font-size:13px;color:var(--muted);margin-top:4px}
  p{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="box">
  <h1>家庭 <b>KTV</b></h1>
  <a id="tv" href="tv.html">📺 電視模式<small>在電視或電腦上播放、用遙控器點歌</small></a>
  <a id="m" href="m.html">📱 手機點歌<small>點歌、語音點歌、最愛、評分麥克風</small></a>
  <p id="note"></p>
</div>
<script>
  const u = new URL(location.href);
  let k = u.searchParams.get("k");
  try { if (k) localStorage.setItem("ktv_key", k); else k = localStorage.getItem("ktv_key"); } catch {}
  if (k) { document.getElementById("tv").href = "tv.html?k=" + encodeURIComponent(k); document.getElementById("m").href = "m.html?k=" + encodeURIComponent(k); }
  else document.getElementById("note").textContent = "請用完整的家庭網址開啟（含金鑰）。";
</script>
</body>
</html>
