<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#171228">
<meta name="mobile-web-app-capable" content="yes">
<title>家庭 KTV · 點歌</title>
<script>
// Some phones open pages in "desktop site" mode (980px wide, tiny text). Scale the page back up to phone size.
(function () {
  function fit() {
    var coarse = window.matchMedia && matchMedia("(pointer:coarse)").matches;
    var land = innerWidth > innerHeight;
    var dev = land ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    var z = innerWidth / dev;
    document.documentElement.style.zoom = coarse && z > 1.25 ? z : "";
  }
  fit(); addEventListener("resize", fit);
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="m.css?v=1794453911">
</head>
<body>
<header id="top">
  <div id="pbox" hidden>
    <div id="player"></div>
    <div id="ptap"></div>
    <div id="pmsg" hidden></div>
    <div id="fsbar">
      <button class="cbtn" data-c="pause">⏯</button>
      <button class="cbtn" data-c="skip">切歌</button>
      <button class="cbtn" data-c="replay">重唱</button>
      <button class="cbtn" data-c="guide">導唱</button>
      <button class="cbtn" data-c="fs">✕ 離開全螢幕</button>
    </div>
  </div>
  <div class="now" id="now"><div class="now-empty">還沒有歌在播，點一首吧 🎤</div></div>
  <div class="ctl-row">
    <button class="cbtn" data-c="pause" aria-label="暫停或播放">⏯</button>
    <button class="cbtn" data-c="skip">切歌</button>
    <button class="cbtn" data-c="replay">重唱</button>
    <button class="cbtn" data-c="guide">導唱</button>
    <button class="cbtn" id="moreBtn">更多</button>
  </div>
  <form class="searchbox" id="sf">
    <input id="q" type="search" placeholder="搜尋歌名、歌星" autocomplete="off" enterkeyhint="search">
    <button type="button" class="voice" id="voiceBtn" aria-label="語音點歌">🎤</button>
  </form>
</header>

<main id="view"></main>

<nav id="tabbar">
  <button data-v="home" class="on"><span>🎵</span>點歌</button>
  <button data-v="artists"><span>🧑‍🎤</span>歌星</button>
  <button data-v="queue"><span>📋</span>已點<b id="qBadge" hidden></b></button>
  <button data-v="mine"><span>★</span>我的</button>
</nav>

<div id="more" class="sheet" hidden>
  <div class="sheet-in">
    <h2>更多功能</h2>
    <p class="muted">影片要在哪裡播？</p>
    <div class="seg mode" id="modeSeg">
      <button data-m="local">📱 在這支手機唱</button>
      <button data-m="remote">📺 遙控電視</button>
    </div>
    <div class="mgrid">
      <button class="cbtn" data-c="fx">👏 掌聲</button>
      <button class="cbtn mic" id="micBtn" aria-pressed="false">🎙 評分麥克風</button>
      <button class="cbtn" data-c="alt">🔀 換一個版本</button>
      <button class="cbtn" data-c="fs" id="fsBtn" hidden>⛶ 全螢幕</button>
      <button class="cbtn" id="swBtn">👤 換人</button>
      <button class="cbtn" id="moreClose">關閉</button>
    </div>
  </div>
</div>

<div id="who" class="sheet" hidden>
  <div class="sheet-in">
    <h2>你是誰？</h2>
    <p class="muted">選自己的名字，點的歌、最愛和分數會記在你名下。</p>
    <div id="whoList"></div>
    <form id="whoForm"><input id="whoName" placeholder="新增名字，例如：Stanley" maxlength="12" autocomplete="off"><button>新增</button></form>
  </div>
</div>
<script type="module" src="m.js?v=1794453911"></script>
</body>
</html>
