<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<title>家庭 KTV · 點歌</title>
<script>
// Some phones open pages in "desktop site" mode (980px wide, tiny text). Scale the page back up to phone size.
(function () {
  function fit() {
    var coarse = window.matchMedia && matchMedia("(pointer:coarse)").matches;
    var land = innerWidth > innerHeight;
    var dev = land ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    var z = innerWidth / dev;
    document.documentElement.style.zoom = coarse && z > 1.25 ? z : "";
  }
  fit(); addEventListener("resize", fit);
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="m.css?v=1795485971">
</head>
<body>
<!-- ===== browse: search on top, songs fill the screen ===== -->
<header id="top">
  <button id="avatar" aria-label="換人">🎤</button>
  <form class="searchbox" id="sf">
    <span class="sic" aria-hidden="true">🔍</span>
    <input id="q" type="search" placeholder="搜尋歌名、歌星" autocomplete="off" enterkeyhint="search">
    <button type="button" class="voice" id="voiceBtn" aria-label="語音點歌">🎙</button>
  </form>
</header>

<main id="view"></main>

<!-- mini player: shows while a song plays and the singing screen is closed -->
<div id="mini" hidden>
  <div class="mthumb"><img id="miniImg" alt=""></div>
  <div class="mt"><b id="miniT"></b><small id="miniA"></small></div>
  <button class="mb" data-c="pause" aria-label="暫停或播放">⏯</button>
  <button class="mb" data-c="skip" aria-label="切歌">⏭</button>
</div>

<nav id="tabbar">
  <button data-v="home" class="on"><span>🎵</span>點歌</button>
  <button data-v="artists"><span>🧑‍🎤</span>歌星</button>
  <button id="singBtn" class="sing" aria-label="開始唱歌"><span>🎤</span></button>
  <button data-v="queue"><span>📋</span>已點<b id="qBadge" hidden></b></button>
  <button data-v="mine"><span>👤</span>我的</button>
</nav>

<!-- ===== singing screen ===== -->
<section id="pl" hidden>
  <div class="plbar">
    <button id="plClose" aria-label="回到點歌">⌄</button>
    <div class="seg mode" id="modeSeg">
      <button data-m="local">📱 手機唱</button>
      <button data-m="remote">📺 電視唱</button>
    </div>
  </div>
  <div id="vslot"><img id="vimg" alt=""><div id="vnote"></div></div>
  <div class="now" id="now"></div>
  <div class="pgrid">
    <button class="pb" data-c="pause"><i>⏯</i>暫停</button>
    <button class="pb" data-c="skip"><i>⏭</i>切歌</button>
    <button class="pb" data-c="replay"><i>🔁</i>重唱</button>
    <button class="pb" data-c="guide"><i>🗣</i>導唱</button>
    <button class="pb" data-c="back"><i>⏪</i>倒退</button>
    <button class="pb" data-c="ff"><i>⏩</i>快轉</button>
    <button class="pb" data-c="alt"><i>🔀</i>換版</button>
  </div>
  <div id="react">
    <button data-e="👏">👏</button><button data-e="❤️">❤️</button><button data-e="🔥">🔥</button><button data-e="😂">😂</button><button data-e="🎉">🎉</button><button data-e="好聽！">好聽</button><button data-e="安可！">安可</button>
  </div>
  <div class="plsec">接下來</div>
  <div id="upnext"></div>
  <div class="plsec">更多</div>
  <div class="mgrid">
    <button class="pb2 mic" id="micBtn" aria-pressed="false">🎙 評分</button>
    <button class="pb2" data-c="fs" id="fsBtn">⛶ 全螢幕（或橫放手機）</button>
    <button class="pb2" id="plBrowse">🎵 繼續點歌</button>
  </div>
</section>

<!-- the video: one element, shown big on the singing screen and small in the mini player -->
<div id="pbox" hidden>
  <div id="player"></div>
  <div id="ptap"></div>
  <div id="pmsg" hidden></div>
  <div id="fsbar">
    <button class="cbtn" data-c="pause">⏯</button>
    <button class="cbtn" data-c="skip">切歌</button>
    <button class="cbtn" data-c="back">⏪5秒</button><button class="cbtn" data-c="ff">⏩5秒</button>
    <button class="cbtn" data-c="replay">重唱</button>
    <button class="cbtn" data-c="guide">導唱</button>
    <button class="cbtn" data-c="fs">✕ 離開全螢幕</button>
  </div>
</div>

<div id="likeBar" hidden></div>

<div id="songSheet" class="sheet" hidden><div class="sheet-in"></div></div>

<div id="who" class="sheet" hidden>
  <div class="sheet-in">
    <h2>你是誰？</h2>
    <p class="muted">選自己的名字，點的歌、最愛和分數會記在你名下。</p>
    <div id="whoList"></div>
    <form id="whoForm"><input id="whoName" placeholder="新增名字，例如：Stanley" maxlength="12" autocomplete="off"><button>新增</button></form>
  </div>
</div>
<script type="module" src="m.js?v=1795485971"></script>
</body>
</html>
